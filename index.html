<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>프로그램 신청</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<style>
:root{
  --paper:#F3F5F0; --surface:#FFFFFF; --ink:#18211C; --muted:#5D6A62; --line:#D9DFD8;
  --board:#1E5E46; --board-ink:#FFFFFF; --seat:#E9C94A; --full:#A8432F; --full-bg:#F6E6E1;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#121714; --surface:#1A211D; --ink:#E7ECE8; --muted:#9AA79F; --line:#2C3631;
    --board:#2F8A67; --board-ink:#FFFFFF; --seat:#E2C24A; --full:#E07A63; --full-bg:#3A221D;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px; line-height:1.55;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:680px; margin:0 auto; padding:0 18px 48px}

/* 상단 칠판 */
.board{background:var(--board); color:var(--board-ink); padding:28px 18px 24px; margin-bottom:20px}
.board .wrap{padding-bottom:0}
.board h1{margin:0 0 6px; font-size:1.65rem; line-height:1.25; font-weight:800; letter-spacing:-0.02em}
.board .notice{margin:0; opacity:.9; white-space:pre-line; font-size:.95rem}
.status{margin-top:16px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline}
.status .state{font-weight:700; font-size:1.05rem}
.status .when{font-size:.9rem; opacity:.85}
.countdown{font-variant-numeric:tabular-nums; font-weight:800; font-size:2rem; letter-spacing:-0.02em; width:100%}

/* 내 정보 */
.me{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:22px}
.me h2{margin:0 0 10px; font-size:1rem}
.fields{display:grid; grid-template-columns:1fr 1fr; gap:10px}
label{display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px}
input{
  width:100%; font:inherit; color:var(--ink); background:var(--paper);
  border:1px solid var(--line); border-radius:10px; padding:11px 12px;
}
input:focus-visible,button:focus-visible{outline:3px solid var(--seat); outline-offset:2px}
.me .row{display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:10px}
.hint{font-size:.85rem; color:var(--muted)}

/* 프로그램 목록 */
.list-head{display:flex; justify-content:space-between; align-items:baseline; margin:0 2px 10px}
.list-head h2{margin:0; font-size:1.1rem}
.list{display:flex; flex-direction:column; gap:12px}
.prog{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:grid; grid-template-columns:1fr auto; gap:4px 16px; align-items:start}
.prog.is-full{background:var(--full-bg); border-color:transparent}
.prog h3{margin:0; font-size:1.08rem; line-height:1.35}
.prog .desc{margin:2px 0 0; color:var(--muted); font-size:.92rem; white-space:pre-line; grid-column:1}
.seats{grid-column:2; grid-row:1 / span 2; text-align:right; min-width:76px}
.seats .left{font-size:2.1rem; font-weight:800; line-height:1; font-variant-numeric:tabular-nums}
.seats .left small{font-size:.9rem; font-weight:600; margin-left:1px}
.seats .of{font-size:.8rem; color:var(--muted); margin-top:4px}
.is-full .seats .left{color:var(--full); font-size:1.3rem}
.meter{grid-column:1 / -1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:10px}
.meter i{display:block; height:100%; background:var(--seat); transition:width .4s}
.is-full .meter i{background:var(--full)}
.prog .act{grid-column:1 / -1; margin-top:12px}

button{font:inherit; cursor:pointer; border:0; border-radius:10px; padding:12px 16px; font-weight:700}
.btn-main{background:var(--board); color:var(--board-ink); width:100%}
.btn-main:disabled{background:var(--line); color:var(--muted); cursor:not-allowed}
.btn-line{background:transparent; color:var(--ink); border:1px solid var(--line); padding:9px 14px}
.btn-danger{background:transparent; color:var(--full); border:1px solid currentColor; padding:7px 12px; font-size:.88rem}

.mine{margin-top:12px; border-top:1px solid var(--line); padding-top:12px; display:none}
.mine.on{display:block}
.mine ul{list-style:none; margin:0; padding:0}
.mine li{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line)}
.mine li:last-child{border-bottom:0}
.mine .t{font-size:.82rem; color:var(--muted)}

.empty{color:var(--muted); text-align:center; padding:32px 0}

dialog{border:0; border-radius:16px; padding:0; width:min(92vw,400px); background:var(--surface); color:var(--ink)}
dialog::backdrop{background:rgba(10,20,15,.55)}
.dlg{padding:22px}
.dlg h3{margin:0 0 8px; font-size:1.15rem}
.dlg p{margin:0 0 18px; color:var(--muted); white-space:pre-line}
.dlg .btns{display:flex; gap:8px}
.dlg .btns button{flex:1}
.dlg.ok h3{color:var(--board)}
.dlg.err h3{color:var(--full)}

@media (max-width:420px){ .fields{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ .meter i{transition:none} }
</style>
</head>
<body>
<header class="board">
  <div class="wrap">
    <h1 id="title">프로그램 신청</h1>
    <p class="notice" id="notice"></p>
    <div class="status" id="status"><span class="state">불러오는 중…</span></div>
  </div>
</header>

<main class="wrap">
  <section class="me">
    <h2>학생 정보</h2>
    <div class="fields">
      <div><label for="sno">학번</label><input id="sno" inputmode="numeric" autocomplete="off" placeholder="예: 10304" maxlength="20"></div>
      <div><label for="sname">이름</label><input id="sname" autocomplete="off" placeholder="예: 홍길동" maxlength="30"></div>
    </div>
    <div class="row">
      <span class="hint">신청·확인·취소 모두 이 정보로 처리돼요.</span>
      <button class="btn-line" id="btnMine">내 신청 확인</button>
    </div>
    <div class="mine" id="mine"></div>
  </section>

  <div class="list-head">
    <h2>프로그램</h2>
    <span class="hint" id="updated"></span>
  </div>
  <div class="list" id="list"><div class="empty">프로그램을 불러오는 중이에요.</div></div>
</main>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
// ===== 여기에 Supabase 주소와 anon(publishable) 키를 넣으세요 =====
const CONFIG = {
  SUPABASE_URL: 'https://ovtaquutqrbrghpwkneo.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_r7ElUIDlBFzoJv3qwd-Tzw_pDtIrrDG'
};
// ===================================================================

const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: false } });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let settings = null, programs = [], offset = 0, pending = false, lastPhase = '';
const now = () => Date.now() + offset;
const fmt = d => new Intl.DateTimeFormat('ko-KR', { month:'long', day:'numeric', weekday:'short', hour:'2-digit', minute:'2-digit' }).format(new Date(d));

function phase(){
  if (!settings) return 'loading';
  const t = now();
  if (t < new Date(settings.open_at).getTime()) return 'before';
  if (t > new Date(settings.close_at).getTime()) return 'after';
  return 'open';
}

async function syncTime(){
  const t0 = Date.now();
  const { data, error } = await sb.rpc('server_time');
  const t1 = Date.now();
  if (!error && data) offset = new Date(data).getTime() - (t0 + t1) / 2;
}

async function loadSettings(){
  const { data, error } = await sb.from('settings').select('*').eq('id', 1).single();
  if (error) throw error;
  settings = data;
  $('title').textContent = data.title;
  document.title = data.title;
  $('notice').textContent = data.notice || '';
}

async function loadPrograms(){
  const { data, error } = await sb.from('programs')
    .select('id,name,description,capacity,applied,sort_order')
    .eq('is_active', true).order('sort_order').order('id');
  if (error) throw error;
  programs = data;
  $('updated').textContent = new Date().toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit', second:'2-digit' }) + ' 기준';
  renderList();
}

function renderStatus(){
  const p = phase();
  const el = $('status');
  if (p === 'loading') return;
  if (p === 'before'){
    const ms = new Date(settings.open_at).getTime() - now();
    const s = Math.max(0, Math.floor(ms / 1000));
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    const pad = n => String(n).padStart(2, '0');
    el.innerHTML = `<span class="state">신청 시작 전</span><span class="when">${esc(fmt(settings.open_at))} 시작</span>
      <span class="countdown">${d ? d + '일 ' : ''}${pad(h)}:${pad(m)}:${pad(sec)}</span>`;
  } else if (p === 'open'){
    el.innerHTML = `<span class="state">신청 중</span><span class="when">${esc(fmt(settings.close_at))}까지</span>`;
  } else {
    el.innerHTML = `<span class="state">신청이 끝났어요</span><span class="when">${esc(fmt(settings.close_at))} 마감</span>`;
  }
}

function renderList(){
  const list = $('list');
  if (!programs.length){ list.innerHTML = '<div class="empty">아직 열린 프로그램이 없어요.</div>'; return; }
  const p = phase();
  list.innerHTML = programs.map(g => {
    const left = Math.max(0, g.capacity - g.applied);
    const full = left === 0;
    const pct = g.capacity ? Math.min(100, g.applied / g.capacity * 100) : 100;
    let label = '신청하기', dis = false;
    if (full){ label = '정원 마감'; dis = true; }
    else if (p === 'before'){ label = '신청 시작 전'; dis = true; }
    else if (p === 'after'){ label = '신청 기간 종료'; dis = true; }
    return `<article class="prog${full ? ' is-full' : ''}">
      <h3>${esc(g.name)}</h3>
      <div class="seats" aria-label="남은 자리">
        ${full ? '<div class="left">마감</div>' : `<div class="left">${left}<small>자리</small></div>`}
        <div class="of">${g.applied} / ${g.capacity}명</div>
      </div>
      ${g.description ? `<p class="desc">${esc(g.description)}</p>` : ''}
      <div class="meter"><i style="width:${pct}%"></i></div>
      <div class="act"><button class="btn-main" data-id="${g.id}" ${dis ? 'disabled' : ''}>${label}</button></div>
    </article>`;
  }).join('');
}

function student(){
  return { no: $('sno').value.replace(/\s/g, '').toUpperCase(), name: $('sname').value.trim() };
}

function showDialog(kind, title, msg, buttons){
  const body = $('dlgBody');
  body.className = 'dlg ' + (kind || '');
  body.innerHTML = `<h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="btns"></div>`;
  const box = body.querySelector('.btns');
  return new Promise(resolve => {
    buttons.forEach(b => {
      const el = document.createElement('button');
      el.className = b.main ? 'btn-main' : 'btn-line';
      el.textContent = b.label;
      el.onclick = () => { $('dlg').close(); resolve(b.value); };
      box.appendChild(el);
    });
    $('dlg').showModal();
  });
}
const alertBox = (kind, title, msg) => showDialog(kind, title, msg, [{ label:'확인', value:true, main:true }]);

async function apply(programId, btn){
  if (pending) return;
  const st = student();
  if (!st.no || !st.name){ await alertBox('err', '학생 정보를 입력해 주세요', '학번과 이름을 먼저 입력해야 신청할 수 있어요.'); $(st.no ? 'sname' : 'sno').focus(); return; }
  const g = programs.find(x => x.id === programId);
  const ok = await showDialog('', '이 프로그램에 신청할까요?', `${g.name}\n${st.no} ${st.name}`,
    [{ label:'취소', value:false }, { label:'신청하기', value:true, main:true }]);
  if (!ok) return;

  pending = true;
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = '신청 중…';
  try {
    const { data, error } = await sb.rpc('register', { p_program_id: programId, p_student_no: st.no, p_student_name: st.name });
    if (error) throw error;
    if (data.ok){
      await alertBox('ok', '신청 완료', `${data.message}\n선착순 ${data.rank}번째예요.`);
      if (g){ g.applied = data.applied; }
      if ($('mine').classList.contains('on')) loadMine();
    } else {
      await alertBox('err', '신청하지 못했어요', data.message);
    }
  } catch (e){
    await alertBox('err', '연결이 원활하지 않아요', '잠시 후 다시 눌러 주세요.\n이미 신청된 경우 "이미 신청한 프로그램"으로 안내돼요.');
  } finally {
    pending = false;
    btn.textContent = original;
    loadPrograms().catch(() => renderList());
  }
}

async function loadMine(){
  const st = student();
  const box = $('mine');
  if (!st.no || !st.name){ await alertBox('err', '학생 정보를 입력해 주세요', '학번과 이름을 입력하면 신청 내역을 볼 수 있어요.'); return; }
  box.classList.add('on');
  box.innerHTML = '<span class="hint">확인하는 중…</span>';
  const { data, error } = await sb.rpc('my_applications', { p_student_no: st.no, p_student_name: st.name });
  if (error){ box.innerHTML = '<span class="hint">내역을 불러오지 못했어요. 다시 시도해 주세요.</span>'; return; }
  if (!data.length){ box.innerHTML = '<span class="hint">신청한 프로그램이 없어요.</span>'; return; }
  const canCancel = settings.allow_cancel && phase() === 'open';
  box.innerHTML = '<ul>' + data.map(a => `<li><div><div>${esc(a.program_name)}</div>
    <div class="t">${new Date(a.created_at).toLocaleString('ko-KR')} 신청</div></div>
    ${canCancel ? `<button class="btn-danger" data-cancel="${a.program_id}">신청 취소</button>` : ''}</li>`).join('') + '</ul>';
}

async function cancel(programId){
  const st = student();
  const ok = await showDialog('err', '신청을 취소할까요?', '취소하면 자리가 다른 학생에게 넘어가요.',
    [{ label:'돌아가기', value:false }, { label:'신청 취소', value:true, main:true }]);
  if (!ok) return;
  const { data, error } = await sb.rpc('cancel_application', { p_program_id: programId, p_student_no: st.no, p_student_name: st.name });
  if (error) await alertBox('err', '취소하지 못했어요', '잠시 후 다시 시도해 주세요.');
  else await alertBox(data.ok ? 'ok' : 'err', data.ok ? '취소 완료' : '취소하지 못했어요', data.message);
  loadMine(); loadPrograms().catch(()=>{});
}

$('list').addEventListener('click', e => {
  const b = e.target.closest('button[data-id]');
  if (b && !b.disabled) apply(Number(b.dataset.id), b);
});
$('mine').addEventListener('click', e => {
  const b = e.target.closest('button[data-cancel]');
  if (b) cancel(Number(b.dataset.cancel));
});
$('btnMine').onclick = loadMine;

// 1초마다 상태·카운트다운 갱신, 시작/마감 순간 버튼 상태 전환
setInterval(() => {
  renderStatus();
  const p = phase();
  if (p !== lastPhase){ lastPhase = p; renderList(); }
}, 1000);

// 남은 자리 자동 새로고침 (접속자마다 시점을 흩어 서버 부하 분산)
function schedule(){
  const wait = 8000 + Math.random() * 6000;
  setTimeout(async () => {
    if (!document.hidden) { try { await loadPrograms(); } catch(e){} }
    schedule();
  }, wait);
}
setInterval(() => { loadSettings().then(renderStatus).catch(()=>{}); syncTime(); }, 60000);

(async function init(){
  try {
    await Promise.all([syncTime(), loadSettings()]);
    lastPhase = phase();
    renderStatus();
    await loadPrograms();
  } catch (e){
    $('list').innerHTML = '<div class="empty">연결하지 못했어요. 새로고침해 주세요.</div>';
  }
  schedule();
})();
</script>
</body>
</html>
